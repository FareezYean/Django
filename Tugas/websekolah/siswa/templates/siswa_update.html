{% extends 'base.html' %}

{% block title %} Edit Siswa {% endblock %}

{% block content %}
<div class="mb-6">
    <h1 class="text-3xl font-bold text-slate-900">EDIT DATA</h1>
    <p class="text-gray-600">Perbarui informasi siswa dengan ID: {{ siswa.id }}</p>
</div>

<form method="post" class="space-y-5 max-w-2xl">
    <!-- token keamanan anti-CSRF -->
    {% csrf_token %}

    <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nama</label>
        <input type="text" name="nama" value="{{ siswa.nama }}" required
               class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Umur</label>
        <input type="number" name="umur" min="1" max="150" value="{{ siswa.umur }}" required
               class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Tanggal Lahir</label>
        <input type="date" name="tgl_lahir" value="{{ siswa.tgl_lahir }}" required
               class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Status Hadir</label>
        <div class="space-x-4">
            <label class="inline-flex items-center">
                <input type="radio" name="status_hadir" value="1" {% if siswa.status_hadir == 1 %}checked{% endif %} required>
                <span class="ml-2">Hadir</span>
            </label>
            <label class="inline-flex items-center">
                <input type="radio" name="status_hadir" value="0" {% if siswa.status_hadir == 0 %}checked{% endif %} required>
                <span class="ml-2">Tidak Hadir</span>
            </label>
        </div>
    </div>

    <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nilai Akhir</label>
        <input type="number" step="any" name="nilai_akhir" min="0" max="100" value="{{ siswa.nilai_akhir }}" required
               class="w-full px-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <div class="flex gap-3 pt-2">
        <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm font-medium hover:bg-green-700">
            Perbarui
        </button>

        <a href="{% url 'siswa_detail' siswa.id %}"
           class="px-4 py-2 bg-slate-100 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-200">
            Batal
        </a>
    </div>
</form>
{% endblock %}
